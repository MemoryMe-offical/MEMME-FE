name: GitHub Issue to Jira (Frontend)

on:
  issues:
    types: [opened]

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira Issue
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "Creating Jira Issue..."
          echo "Labels: $LABELS"
          
          ISSUE_TYPE="Task"
          EPIC_KEY="MEM-1"
          PREFIX="[FE]"
          
          if [[ "$LABELS" == *"feature"* ]] || [[ "$LABELS" == *"enhancement"* ]]; then
            ISSUE_TYPE="Story"
          elif [[ "$LABELS" == *"bug"* ]] || [[ "$LABELS" == *"fix"* ]]; then
            ISSUE_TYPE="Bug"
          elif [[ "$LABELS" == *"refactor"* ]] || [[ "$LABELS" == *"chore"* ]]; then
            ISSUE_TYPE="Task"
          fi
          
          echo "Issue Type: $ISSUE_TYPE"
          
          DESCRIPTION=$(cat <<EOF
          {
            "type": "doc",
            "version": 1,
            "content": [
              {
                "type": "paragraph",
                "content": [
                  {
                    "type": "text",
                    "text": "GitHub Issue: ",
                    "marks": [{"type": "strong"}]
                  },
                  {
                    "type": "text",
                    "text": "$ISSUE_URL",
                    "marks": [
                      {
                        "type": "link",
                        "attrs": {
                          "href": "$ISSUE_URL"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "paragraph",
                "content": [
                  {
                    "type": "text",
                    "text": "Repository: MEMME-FE"
                  }
                ]
              },
              {
                "type": "paragraph",
                "content": [
                  {
                    "type": "text",
                    "text": "Labels: $LABELS"
                  }
                ]
              },
              {
                "type": "rule"
              },
              {
                "type": "paragraph",
                "content": [
                  {
                    "type": "text",
                    "text": "$ISSUE_BODY"
                  }
                ]
              }
            ]
          }
          EOF
          )
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue" \
            -d "{
              \"fields\": {
                \"project\": {
                  \"key\": \"$JIRA_PROJECT_KEY\"
                },
                \"summary\": \"$PREFIX $ISSUE_TITLE\",
                \"description\": $DESCRIPTION,
                \"issuetype\": {
                  \"name\": \"$ISSUE_TYPE\"
                },
                \"parent\": {
                  \"key\": \"$EPIC_KEY\"
                }
              }
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 201 ]; then
            JIRA_KEY=$(echo "$BODY" | jq -r '.key')
            echo "Jira issue created: $JIRA_KEY"
            echo "$JIRA_BASE_URL/browse/$JIRA_KEY"
          else
            echo "Failed to create Jira issue (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi